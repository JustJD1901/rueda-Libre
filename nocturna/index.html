<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-slate-950 text-white">
    <main class="max-w-3xl mx-auto px-6 py-16 space-y-6">
        <p
            class="inline-block bg-slate-800 text-amber-400 px-3 py-1 text-xs font-semibold uppercase tracking-wider rounded-full">
            Nuevo · Jueves a sábado
        </p>

        <h1 class="text-4xl font-bold tracking-tight leading-tight text-white">
            Rueda Nocturna
        </h1>

        <p class="max-w-xl text-lg leading-relaxed text-slate-300">
            Descubre Medellín en bici cuando se encienden las luces
        </p>

        <div class="w-full max-w-md bg-slate-900 p-4 space-y-2 rounded-lg">
            <p class="text-base font-semibold text-amber-400">3 rutas</p>
            <p class="text-base font-semibold text-white">Desde $55.000</p>
        </div>

        <div class="flex flex-wrap gap-4 pt-2">
            <!-- Botón principal -->
            <button type="button"
                class="px-6 py-3 bg-amber-400 text-slate-950 text-sm font-bold uppercase tracking-wide rounded-lg shadow-md hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300 focus:ring-offset-2 focus:ring-offset-slate-950">
                Inscríbete
            </button>

            <!-- Botón secundario -->
            <button type="button"
                class="px-6 py-3 bg-slate-800 text-white text-sm font-bold uppercase tracking-wide rounded-lg shadow-sm hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 focus:ring-offset-slate-950">
                Ver rutas
            </button>

            <!-- Botón de contorno -->
            <button type="button"
                class="px-6 py-3 border border-amber-400 text-amber-400 text-sm font-bold uppercase tracking-wide rounded-lg shadow-sm hover:bg-amber-400/10 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 focus:ring-offset-slate-950">
                Más información
            </button>
        </div>
    </main>
</body>

</html>
